## Alternative Sequences

**Quick-win sequence (momentum first):**
1. T-ZZZ (1h) - Immediate value
2. T-XXX (2h) - High impact
...

**Strategic sequence (foundation first):**
1. T-AAA (6h) - Foundation
2. T-XXX (2h) - Build on it
...

**Confidence:** X%
**Last Updated:** [timestamp]
```

## Update Frequency
- Daily: Auto-refresh if status changes
- Weekly: Full re-prioritization
- On-demand: When asked

## Success Metrics
- User satisfaction: >90% agree with priority
- Flow efficiency: Minimal blockers
- Strategic alignment: 100% of top 5 align with goals
