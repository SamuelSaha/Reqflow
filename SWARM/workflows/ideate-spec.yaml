## Process Details

### Step 1: Problem Framing (3 min)

**Agent:** @swarm-analyst  
**Skills:** execution-discipline (context analysis)

**Questions to answer:**
- What pain are we solving?
- Who has this pain? (User personas)
- How severe is it? (Frequency × Impact)
- Current workarounds?

**Output:** Problem statement with evidence

**Progress Update:**
```
✅ Step 1: Problem Framing (2.5 min, 1.2k tokens)
📝 Found: [Key finding summary]
⏳ Step 2: Starting UX Exploration...
```

---

### Step 2: UX Exploration (3 min)

**Agent:** @swarm-ux  
**Skills:** accessibility-wcag, next15-patterns

**Explore:**
- User journey (3-step max)
- Mental models
- Interaction patterns
- Error/edge cases
- Accessibility needs

**Output:** UX concept + wireframe ideas

**Assumptions to Validate:**
- Animation level: [subtle/none/dynamic]?
- Mobile-first or desktop-first?
- Brand voice: [professional/friendly/minimal]?

**Progress Update:**
```
✅ Step 2: UX Exploration (2.8 min, 1.5k tokens)
🎨 Concept: [1-sentence summary]
⏳ Step 3: Starting Business Value analysis...
```

---

### Step 3: Business Value (3 min)

**Agent:** @swarm-growth  
**Skills:** saas-workflows

**Calculate:**
- Revenue impact (if applicable)
- User retention effect
- Acquisition boost
- Cost savings
- Competitive advantage

**Output:** Business case with metrics

**Progress Update:**
```
✅ Step 3: Business Value (2.2 min, 1.0k tokens)
💰 Value: [High/Medium/Low] - [key metric]
⏳ Step 4: Starting Technical Feasibility...
```

---

### Step 4: Technical Feasibility (3 min)

**Agent:** @swarm-arch  
**Skills:** system-design, api-design

**Assess:**
- Implementation complexity (1-10)
- Tech stack fit
- Integration points
- Scalability concerns
- Maintenance burden

**Output:** Technical assessment

**Progress Update:**
```
✅ Step 4: Technical Feasibility (2.9 min, 1.8k tokens)
⚙️ Complexity: [X/10] - [key technical concern]
⏳ Step 5: Starting Decision Matrix...
```

---

### Step 5: Decision Matrix (3 min)

**Agent:** @swarm-orch  
**Skills:** execution-discipline, token-optimization

**Consolidate:**

```
DIMENSION          | SCORE | CONFIDENCE
-------------------|-------|-------------
User Value         | 1-10  | %
Business Value     | 1-10  | %
Technical Feasibility| 1-10| %
UX Complexity      | 1-10  | %
Maintenance Cost   | 1-10  | %

RECOMMENDATION: [Proceed / Refine / Reject]
NEXT STEP: [Create spec / More research / Abandon]
```

**Progress Update:**
```
✅ Step 5: Decision Matrix (1.5 min, 0.8k tokens)
📊 RECOMMENDATION: [Proceed/Refine/Reject]
🎯 Confidence: [X]%
```

