# Workflow: Ideate Specification

> **TRIGGER:** User wants to explore an idea before committing to spec
> **INPUT:** Vague concept or problem statement
> **OUTPUT:** Explored dimensions with recommendations + agent visibility report
> **TIME:** 15 minutes max

---

## 🤖 ACTIVE AGENT ROSTER

Before starting, the following agents will be activated:

| Step | Agent | Role | Skills Loaded | Task | Est. Time |
|------|-------|------|---------------|------|-----------|
| 1 | @swarm-analyst | Problem Analyst | execution-discipline | Frame the problem | 3 min |
| 2 | @swarm-ux | UX Designer | accessibility-wcag, next15-patterns | Explore UX solutions | 3 min |
| 3 | @swarm-growth | Growth Strategist | saas-workflows | Calculate business value | 3 min |
| 4 | @swarm-arch | System Architect | system-design, api-design | Assess technical feasibility | 3 min |
| 5 | @swarm-orch | Director | execution-discipline, token-optimization | Consolidate & decide | 3 min |

**Summary:**
- **Total Agents:** 5
- **Total Skills:** 9
- **Estimated Tokens:** 6-8k
- **Estimated Time:** 15 min
- **Mode:** Sequential (agents work one after another)

---

## ⚠️ ASSUMPTIONS LEDGER (AUTO)

Assumptions for this ideation (we proceed with defaults unless constraints change):

### For This Ideation, I'm Assuming:

1. **Problem Severity:** Medium-to-high impact user pain
   - Default: prioritize the highest-impact pain first

2. **UX Complexity:** Standard web patterns (not novel interactions)
   - Default: minimal, familiar patterns; novelty only if it improves outcomes

3. **Business Priority:** Revenue or retention focused
   - Default: optimize for measurable outcome (retention/revenue), not vanity

4. **Technical Constraint:** Existing stack (Next.js + Supabase)
   - Default: assume existing stack; avoid tech churn

5. **Output Depth:** Quick exploration (not detailed spec)
   - Default: 15-minute exploration with a clear recommendation + next move

**Blocking question rule:** Only ask the user if an external constraint is missing and work cannot proceed.

