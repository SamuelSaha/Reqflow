version: "3.8"

services:
  # PostgreSQL Database (mirrors Neon production schema)
  postgres:
    image: postgres:16-alpine
    container_name: reqflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reqflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (mirrors Upstash production cache)
  redis:
    image: redis:7-alpine
    container_name: reqflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # BullMQ Worker (background jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: reqflow-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/reqflow
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env.local
    volumes:
      - ./src:/app/src:ro
      - ./package.json:/app/package.json:ro
    profiles:
      - full # Only start with docker compose --profile full up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: reqflow-network
