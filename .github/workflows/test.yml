name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "test-secret-key-for-ci-minimum-32-chars"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --workspace=app

      - name: Generate coverage report
        run: npm run test:coverage --workspace=app

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./app/coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "test-secret-key-for-ci-minimum-32-chars"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm ci doesn't resolve platform-specific optional deps from macOS-generated lock file (npm/cli#4828)
      - name: Install platform-specific native binaries
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.2.1 lightningcss-linux-x64-gnu@1.31.1 @unrs/resolver-binding-linux-x64-gnu@1.11.1

      - name: Push database schema
        run: cd app && npx drizzle-kit push --force

      - name: Seed test data
        run: cd app && npx tsx scripts/seed-dev.ts

      - name: Install Playwright Browsers
        run: cd app && npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e --workspace=app

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "test-secret-key-for-ci-minimum-32-chars"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check --workspace=app

  build:
    name: Build Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      REDIS_URL: "redis://localhost:6379"
      AUTH_SECRET: "test-secret-key-for-ci-minimum-32-chars"
      AUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm ci doesn't resolve platform-specific optional deps from macOS-generated lock file (npm/cli#4828)
      - name: Install platform-specific native binaries
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu@4.2.1 lightningcss-linux-x64-gnu@1.31.1 @unrs/resolver-binding-linux-x64-gnu@1.11.1

      - name: Build
        run: npm run build --workspace=app
