name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: "Skip database migrations (emergency deploy)"
        required: false
        default: "false"
        type: boolean

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Stage 1: Run full test suite ───────────────────────────────
  test:
    name: Test Suite
    uses: ./.github/workflows/test.yml

  # ── Stage 2: Run database migrations ───────────────────────────
  migrate:
    name: Database Migrations
    needs: test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_migrations != 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production migrations
        run: cd app && npx tsx scripts/migrate-prod.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Stage 3: Deploy to Vercel ──────────────────────────────────
  deploy:
    name: Deploy to Vercel
    needs: [test, migrate]
    # Also run if migrations were skipped
    if: ${{ always() && needs.test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest

    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token="$VERCEL_TOKEN"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ── Stage 4: Post-deploy verification ──────────────────────────
  verify:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Wait for deployment to stabilize
        run: sleep 10

      - name: Run smoke tests
        run: bash app/scripts/smoke-test.sh
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

  # ── Deployment notification ────────────────────────────────────
  notify:
    name: Notify
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment summary
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.deployment_url }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$VERIFY_RESULT" == "success" ]; then
            echo "## Deploy Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**URL:** $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "**Commit:** $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
            echo "**Triggered by:** $ACTOR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deploy Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Deploy:** $DEPLOY_RESULT" >> "$GITHUB_STEP_SUMMARY"
            echo "**Smoke tests:** $VERIFY_RESULT" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check logs and consider rollback." >> "$GITHUB_STEP_SUMMARY"
          fi
