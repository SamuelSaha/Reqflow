name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs for the same PR
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Fast validation before deploying ────────────────────────────
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=app

      - name: Type check
        run: npm run type-check --workspace=app

  # ── Deploy preview to Vercel ────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build for preview
        run: vercel build --token="$VERCEL_TOKEN"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = process.env.COMMIT_SHA;
            const ref = process.env.BRANCH_REF;
            const actor = process.env.ACTOR;

            const body = `## 🚀 Preview Deployment

            **Preview URL:** ${url}

            **Changes:**
            - Commit: \`${sha.substring(0, 7)}\`
            - Branch: \`${ref}\`
            - Author: @${actor}

            ✅ Preview deployment ready for testing!`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Visual regression testing (optional) ────────────────────────
  visual-regression:
    name: Visual Regression
    needs: deploy-preview
    runs-on: ubuntu-latest
    if: false  # Enable when ready
    steps:
      - uses: actions/checkout@v4

      - name: Run Percy visual tests
        run: echo "Percy integration placeholder"
        # Add Percy or Chromatic integration here
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
